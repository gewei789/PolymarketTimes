name = "polymarket-times"
compatibility_date = "2026-01-16"
compatibility_flags = ["nodejs_compat", "nodejs_compat_v2"]
pages_build_output_dir = ".opennext"
workers_dev = true

main = ".open-next/worker.js"             # OpenNext 构建后的标准入口（确认你的 .open-next 输出路径）
[assets]
directory = ".open-next/assets"           # 或 .open-next/build/public，根据你的构建输出调整
binding = "ASSETS"